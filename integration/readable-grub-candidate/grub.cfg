# Active dedicated menu maintained on ESP; Btrfs historical menu preserved.
search --no-floppy --fs-uuid --set=linuxroot b7e9ce03-4b90-4c6a-8091-643c8c5879e5
set prefix=($linuxroot)/@/boot/grub

# Readable graphics terminal; unsupported graphics leave firmware console available.
search --no-floppy --fs-uuid --set=sp7efi 9E39-0F59
if loadfont ($sp7efi)/EFI/SP7Manjaro/fonts/sp7-menu-32.pf2; then
 set gfxmode=1368x912,1280x800,1024x768,auto
 insmod all_video
 insmod gfxterm
 set gfxterm_font="SP7Menu Bold 32"
 terminal_output gfxterm
fi
set menu_color_normal=white/black
set menu_color_highlight=black/light-gray
# Separate first-boot menu; original Manjaro grub.cfg remains preserved.
set default=0
set timeout=12
menuentry 'Windows 11' {
 insmod part_gpt
 insmod fat
 search --no-floppy --fs-uuid --set=root 9E39-0F59
 chainloader /EFI/Microsoft/Boot/bootmgfw.efi
}
menuentry 'Manjaro - kontrollstart (textlage)' {
 search --no-floppy --fs-uuid --set=root b7e9ce03-4b90-4c6a-8091-643c8c5879e5
 linux /@/boot/vmlinuz-linux-surface root=UUID=b7e9ce03-4b90-4c6a-8091-643c8c5879e5 rw rootflags=subvol=@ noresume systemd.unit=multi-user.target
 initrd /@/boot/intel-ucode.img /@/boot/initramfs-linux-surface.img
}

menuentry 'Manjaro - skrivbord' {
 search --no-floppy --fs-uuid --set=root b7e9ce03-4b90-4c6a-8091-643c8c5879e5
 linux /@/boot/vmlinuz-linux-surface root=UUID=b7e9ce03-4b90-4c6a-8091-643c8c5879e5 rw rootflags=subvol=@ noresume
 initrd /@/boot/intel-ucode.img /@/boot/initramfs-linux-surface.img
}
