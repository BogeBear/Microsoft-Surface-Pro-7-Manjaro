# Separate dualboot candidate; no dependence on previous gpt2 location.
search --no-floppy --fs-uuid --set=sp7linux b7e9ce03-4b90-4c6a-8091-643c8c5879e5
if [ -n "$sp7linux" ]; then
  set root="$sp7linux"
  set prefix="($sp7linux)/@/boot/grub"
  configfile "($sp7linux)/@/boot/grub/grub.cfg"
fi
echo "SP7 Manjaro filesystem or configuration unavailable. Use Windows Boot Manager."
sleep --interruptible 30
halt
